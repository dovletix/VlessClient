name: Mobile apps

# Builds the phone apps (mobile/): the sing-box library (libbox) for Android and iOS, the Russian
# geo rule-sets, the Android APKs and an unsigned iOS build. A tag like mobile-v1.0.0 publishes a
# GitHub Release with the APKs (never marked "latest": the Windows updater reads releases/latest).

on:
  push:
    branches: [main, mobile]
    tags: ['mobile-v*']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SING_BOX_VERSION: '1.14.4'
  GO_VERSION: '1.26.10'
  GOMOBILE_VERSION: 'v0.1.13'
  FLUTTER_VERSION: '3.47.9'
  # what the phone needs from sing-box: TUN (gvisor), QUIC, uTLS/Reality, Clash API
  # bump LIBBOX_CACHE whenever the tags or flags below change (the built library is cached)
  LIBBOX_CACHE: '1'
  LIBBOX_TAGS: 'with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0'
  LIBBOX_LDFLAGS: '-X github.com/sagernet/sing-box/constant.Version=1.14.4 -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid='
  # the geo databases are the ones the Windows MSI ships (cores.ps1)
  XRAY_ZIP_URL: 'https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-windows-64.zip'
  XRAY_ZIP_SHA256: '1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d'
  SING_BOX_LINUX_URL: 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz'
  SING_BOX_LINUX_SHA256: '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968'
  # Xray for the nodes sing-box cannot carry (XHTTP): bundled as libxray.so; the Linux build checks configs and serves the e2e test
  XRAY_RELEASE: 'https://github.com/XTLS/Xray-core/releases/download/v26.11.9'
  XRAY_ANDROID_ARM64_SHA256: 'edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b'
  XRAY_ANDROID_AMD64_SHA256: '48c266cdb9660dade968814e2f91d84e6aff534b7c3762ca3e385fb8aa475bd8'
  XRAY_LINUX_SHA256: 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check generated configs with the real cores
        run: |
          set -e
          dl="$RUNNER_TEMP/cores" && mkdir -p "$dl"
          curl -fsSL -o "$dl/sb.tar.gz" "$SING_BOX_LINUX_URL"
          echo "$SING_BOX_LINUX_SHA256  $dl/sb.tar.gz" | sha256sum -c -
          tar -xzf "$dl/sb.tar.gz" -C "$dl" --strip-components=1
          curl -fsSL -o "$dl/xray.zip" "$XRAY_RELEASE/Xray-linux-64.zip"
          echo "$XRAY_LINUX_SHA256  $dl/xray.zip" | sha256sum -c -
          unzip -q -o "$dl/xray.zip" xray -d "$dl"
          CONFIG_OUT="$RUNNER_TEMP/cfg" flutter test test/config_files_test.dart
          "$dl/sing-box" check -c "$RUNNER_TEMP/cfg/sing-box.json"
          "$dl/xray" run -test -c "$RUNNER_TEMP/cfg/xray.json"

  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Xray databases and sing-box
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          curl -fsSL -o xray.zip "$XRAY_ZIP_URL"
          echo "$XRAY_ZIP_SHA256  xray.zip" | sha256sum -c -
          unzip -q -o xray.zip geoip.dat geosite.dat
          curl -fsSL -o sb.tar.gz "$SING_BOX_LINUX_URL"
          echo "$SING_BOX_LINUX_SHA256  sb.tar.gz" | sha256sum -c -
          tar -xzf sb.tar.gz --strip-components=1
      - name: Build rule-sets
        run: |
          set -e
          out="$RUNNER_TEMP/rules"
          python3 -I mobile/tools/geo_rules.py "$RUNNER_TEMP/dl/geoip.dat" "$RUNNER_TEMP/dl/geosite.dat" "$out"
          for n in geoip-ru geosite-ru geosite-ru-blocked; do
            "$RUNNER_TEMP/dl/sing-box" rule-set compile --output "$out/$n.srs" "$out/$n.json"
          done
          mkdir -p dist && cp "$out"/*.srs dist/ && ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: geo-rules
          path: dist/*.srs
          if-no-files-found: error

  libbox-android:
    runs-on: ubuntu-latest
    steps:
      - name: Cache library
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/libbox.aar
          key: libbox-android-${{ env.SING_BOX_VERSION }}-${{ env.GO_VERSION }}-${{ env.GOMOBILE_VERSION }}-${{ env.LIBBOX_CACHE }}
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Build libbox.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          git clone --depth 1 --branch "v$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          go install -v "github.com/sagernet/gomobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install -v "github.com/sagernet/gomobile/cmd/gobind@$GOMOBILE_VERSION"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v -o libbox.aar -target android/arm64,android/arm,android/amd64 -androidapi 24 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "$LIBBOX_LDFLAGS" -tags "$LIBBOX_TAGS" ./experimental/libbox
          mkdir -p "$GITHUB_WORKSPACE/dist" && mv libbox.aar "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-android
          path: dist/libbox.aar
          compression-level: 0
          if-no-files-found: error

  libbox-ios:
    runs-on: macos-15
    steps:
      - name: Cache library
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/Libbox.xcframework
          key: libbox-ios-${{ env.SING_BOX_VERSION }}-${{ env.GO_VERSION }}-${{ env.GOMOBILE_VERSION }}-${{ env.LIBBOX_CACHE }}
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build Libbox.xcframework
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch "v$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          go install -v "github.com/sagernet/gomobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install -v "github.com/sagernet/gomobile/cmd/gobind@$GOMOBILE_VERSION"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v -target ios,iossimulator -libname=box -tags-not-macos=with_low_memory -iosversion=15.0 \
            -trimpath -buildvcs=false -ldflags "$LIBBOX_LDFLAGS" -tags "$LIBBOX_TAGS,grpcnotrace" ./experimental/libbox
          mkdir -p "$GITHUB_WORKSPACE/dist" && mv Libbox.xcframework "$GITHUB_WORKSPACE/dist/"
          du -sh "$GITHUB_WORKSPACE/dist/Libbox.xcframework"
      - name: Pack
        run: cd dist && zip -qry Libbox.xcframework.zip Libbox.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-ios
          path: dist/Libbox.xcframework.zip
          compression-level: 0
          if-no-files-found: error

  android:
    needs: [test, geo, libbox-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: libbox-android
          path: mobile/android/app/libs
      - uses: actions/download-artifact@v4
        with:
          name: geo-rules
          path: mobile/assets/rules
      - name: Bundle Xray (libxray.so)
        run: |
          set -e
          for pair in "arm64-v8a arm64-v8a $XRAY_ANDROID_ARM64_SHA256" "x86_64 amd64 $XRAY_ANDROID_AMD64_SHA256"; do
            set -- $pair
            curl -fsSL -o "$RUNNER_TEMP/xray-$1.zip" "$XRAY_RELEASE/Xray-android-$2.zip"
            echo "$3  $RUNNER_TEMP/xray-$1.zip" | sha256sum -c -
            mkdir -p "mobile/android/app/src/main/jniLibs/$1"
            unzip -q -o -p "$RUNNER_TEMP/xray-$1.zip" xray > "mobile/android/app/src/main/jniLibs/$1/libxray.so"
            chmod 755 "mobile/android/app/src/main/jniLibs/$1/libxray.so"
          done
          ls -l mobile/android/app/src/main/jniLibs/*
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF_NAME#mobile-v}"; else v="1.0.0"; fi
          [[ "$v" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,5}$ ]] || { echo "Bad version: $v"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key in the repository secrets: the APK is signed with a throw-away debug key."
            if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then echo "A release needs the real key."; exit 1; fi
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APKs
        working-directory: mobile
        run: |
          set -e
          v="${{ steps.version.outputs.value }}"
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$v" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/VlessClient-$v-$abi.apk"
          done
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$v" --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/VlessClient-$v-universal.apk"
          ls -l ../dist
          # debug build for the emulator test (run-as needs a debuggable app)
          flutter build apk --debug --target-platform android-x64 --build-name "$v" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p ../debug && cp build/app/outputs/flutter-apk/app-debug.apk ../debug/
      - uses: actions/upload-artifact@v4
        with:
          name: VlessClient-android
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VlessClient-android-debug
          path: debug/app-debug.apk
          retention-days: 7

  android-e2e:
    needs: [android]
    runs-on: ubuntu-latest
    env:
      E2E_UUID: 3f6c0d52-8a1e-4b7a-9c55-2d8e1f0a7b13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: VlessClient-android-debug
          path: ${{ runner.temp }}/apk
      - name: VLESS test server on the host
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o sb.tar.gz "$SING_BOX_LINUX_URL"
          echo "$SING_BOX_LINUX_SHA256  sb.tar.gz" | sha256sum -c -
          tar -xzf sb.tar.gz --strip-components=1
          cat > server.json <<EOF
          {"log": {"level": "info", "output": "$RUNNER_TEMP/server.log"},
           "inbounds": [{"type": "vless", "listen": "0.0.0.0", "listen_port": 10443, "users": [{"uuid": "$E2E_UUID"}]}],
           "outbounds": [{"type": "direct"}]}
          EOF
          nohup ./sing-box run -c server.json > server-stdout.log 2>&1 &
          # an XHTTP server (only Xray speaks it): the phone reaches it through its bundled Xray
          curl -fsSL -o xray.zip "$XRAY_RELEASE/Xray-linux-64.zip"
          echo "$XRAY_LINUX_SHA256  xray.zip" | sha256sum -c -
          unzip -q -o xray.zip xray
          cat > xray-server.json <<EOF
          {"log": {"loglevel": "info", "access": "$RUNNER_TEMP/xray-access.log", "error": "$RUNNER_TEMP/xray-error.log"},
           "inbounds": [{"listen": "0.0.0.0", "port": 10444, "protocol": "vless",
                         "settings": {"clients": [{"id": "$E2E_UUID"}], "decryption": "none"},
                         "streamSettings": {"network": "xhttp", "xhttpSettings": {"path": "/ci", "mode": "auto"}}}],
           "outbounds": [{"protocol": "freedom"}]}
          EOF
          nohup ./xray run -c xray-server.json > xray-stdout.log 2>&1 &
          sleep 2 && ss -ltn | grep -E '10443|10444'      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/tools/e2e_android.sh "$RUNNER_TEMP/apk/app-debug.apk" "$E2E_UUID" "$RUNNER_TEMP/server.log" "$GITHUB_WORKSPACE/e2e" "$RUNNER_TEMP/xray-access.log"
      - name: Server log
        if: always()
        run: cp "$RUNNER_TEMP/server.log" "$RUNNER_TEMP"/xray-*.log e2e/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: e2e/
          retention-days: 14

  ios:
    needs: [test, geo, libbox-ios]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: libbox-ios
          path: ${{ runner.temp }}/libbox
      - uses: actions/download-artifact@v4
        with:
          name: geo-rules
          path: mobile/assets/rules
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF_NAME#mobile-v}"; else v="1.0.0"; fi
          [[ "$v" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,5}$ ]] || { echo "Bad version: $v"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Add the tunnel extension to the Xcode project
        run: |
          set -e
          unzip -q "$RUNNER_TEMP/libbox/Libbox.xcframework.zip" -d mobile/ios
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby mobile/tools/add_tunnel_target.rb mobile/ios/Runner.xcodeproj "${{ steps.version.outputs.value }}" "$GITHUB_RUN_NUMBER"
      - name: Build (unsigned)
        working-directory: mobile
        run: |
          set -e
          v="${{ steps.version.outputs.value }}"
          flutter pub get
          flutter build ios --release --no-codesign --build-name "$v" --build-number "$GITHUB_RUN_NUMBER"
          test -d build/ios/iphoneos/Runner.app/PlugIns/PacketTunnel.appex
          mkdir -p ../dist/Payload && cp -R build/ios/iphoneos/Runner.app ../dist/Payload/
          cd ../dist && zip -qry "VlessClient-$v-ios-unsigned.ipa" Payload && rm -rf Payload && ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: VlessClient-ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, android-e2e, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VlessClient-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: VlessClient-ios
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#mobile-v}"
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "VlessClient для телефона $v" \
            --notes "Android: скачайте VlessClient-$v-arm64-v8a.apk (подходит почти всем телефонам) или VlessClient-$v-universal.apk, если не уверены. Откройте файл на телефоне и разрешите установку. Уже установленное приложение обновится по кнопке «Проверить обновления» в настройках. iPhone: файл -ios-unsigned.ipa не подписан, установить его можно только переподписав своим платным аккаунтом разработчика Apple (бесплатный не даёт приложениям права на VPN)."
