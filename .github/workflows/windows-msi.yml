name: Windows MSI

# Every push and pull request builds the installer (as a workflow artifact).
# Pushing a tag like v2.0.1 also publishes a GitHub Release with the MSI attached;
# the app's "Проверить обновления" button reads that release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths-ignore: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-2022
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Version
        id: version
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "2.0.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,5}$') { throw "Bad version: $v" }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build MSI
        shell: powershell
        run: .\installer\build-msi.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: VlessClient-x64
          path: installer/dist/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VlessClient-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.msi \
            --repo "$GITHUB_REPOSITORY" \
            --title "VlessClient ${GITHUB_REF_NAME#v}" \
            --notes "Скачайте файл VlessClient-${GITHUB_REF_NAME#v}-x64.msi ниже и запустите его. Уже установленный VlessClient обновится по кнопке «Проверить обновления» в настройках."
